<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CourseCraft</title>
  <link rel="stylesheet" href="ui/popup.css" />
</head>
<body class="theme-dark">
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>CourseCraft</h1>
          <span class="badge-free">100% Free & Local</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <svg id="themeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5" />
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Open Settings" aria-label="Open Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- User Account & Course Info Card -->
    <div id="accountCard" class="account-card">
      <div class="user-row">
        <div class="user-avatar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="user-meta">
          <div class="user-name-line">
            <span id="userNameDisplay" class="user-name">Coursera Learner</span>
            <span id="sessionBadge" class="session-badge badge-active">Active</span>
          </div>
          <div class="user-id-line">
            <span class="id-label">User ID:</span>
            <span id="userIdDisplay" class="user-id-value">161276145</span>
            <button id="editUserIdBtn" class="edit-id-btn" title="Edit / Change User ID" aria-label="Edit User ID">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Quick Edit User ID box -->
      <div id="editUserIdBox" class="edit-id-box hidden">
        <input type="text" id="manualUserIdInput" placeholder="User ID (e.g. 161276145)" />
        <button id="saveManualUserIdBtn" class="btn-sm">Save</button>
      </div>

      <div class="course-row">
        <div class="status-indicator"></div>
        <div class="course-meta">
          <span id="courseStatusTitle" class="course-name">Detecting Coursera...</span>
          <span id="courseStatusSubtitle" class="course-subtitle">Open any course to start</span>
        </div>
      </div>
    </div>

    <!-- Main Actions Grid -->
    <main class="actions-section">
      <div class="section-label">Automate Tasks</div>
      <div class="action-grid" id="actionGrid">
        <!-- Lecture -->
        <button class="action-card" data-action="lecture">
          <div class="card-icon card-blue">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Watch Lecture</span>
            <span class="card-desc">Complete lectures in section</span>
          </div>
        </button>

        <!-- Skip Video+ -->
        <button class="action-card highlight-card" data-action="skipvideoplus">
          <div class="card-icon card-purple">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 4 15 12 5 20 5 4" />
              <line x1="19" y1="5" x2="19" y2="19" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Skip Video+</span>
            <span class="card-desc">Bulk finish all course videos</span>
          </div>
        </button>

        <!-- Reading -->
        <button class="action-card" data-action="reading">
          <div class="card-icon card-emerald">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Read Material</span>
            <span class="card-desc">Mark reading items complete</span>
          </div>
        </button>

        <!-- Discussion -->
        <button class="action-card" data-action="discussion">
          <div class="card-icon card-amber">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Discussion</span>
            <span class="card-desc">Auto-post peer response</span>
          </div>
        </button>

        <!-- Dialogue / AI Coach -->
        <button class="action-card" data-action="dialogue">
          <div class="card-icon card-teal">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a10 10 0 0 1 10 10c0 5.52-4.48 10-10 10S2 17.52 2 12A10 10 0 0 1 12 2z" />
              <path d="M8 12h8M12 8v8" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">AI Coach Dialogue</span>
            <span class="card-desc">End & complete dialogue</span>
          </div>
        </button>

        <!-- Practice Widget -->
        <button class="action-card" data-action="ungradedplugin">
          <div class="card-icon card-rose">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 11 12 14 22 4" />
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Practice Widget</span>
            <span class="card-desc">Solve ungraded exercises</span>
          </div>
        </button>

        <!-- Quiz Assistant (Full Span) -->
        <button class="action-card card-span-2" data-action="quiz">
          <div class="card-icon card-indigo">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
          </div>
          <div class="card-content">
            <div class="card-title-row">
              <span class="card-title">AI Quiz Assistant</span>
              <span class="shortcut-tag">Alt + Z</span>
            </div>
            <span class="card-desc">Solve graded quizzes, auto-fill Honor Code & name</span>
          </div>
        </button>

        <!-- Backup -->
        <button class="action-card" data-action="coursebackup">
          <div class="card-icon card-sky">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Course Backup</span>
            <span class="card-desc">Export outline & resources</span>
          </div>
        </button>

        <!-- Shareable Link -->
        <button class="action-card" data-action="shareablelink">
          <div class="card-icon card-violet">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Shareable Link</span>
            <span class="card-desc">Copy peer assignment link</span>
          </div>
        </button>
      </div>
    </main>

    <!-- Live Execution Logs Console -->
    <div class="logs-section">
      <div class="logs-header" id="toggleLogsBtn">
        <div class="logs-title">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 17 10 11 4 5"/>
            <line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
          <span>Live Execution Logs</span>
        </div>
        <div class="logs-actions">
          <button id="copyLogsBtn" class="btn-xs" title="Copy Logs to Clipboard">Copy</button>
          <button id="clearLogsBtn" class="btn-xs" title="Clear Logs">Clear</button>
          <span id="logsToggleArrow" class="arrow-down">▼</span>
        </div>
      </div>
      <div id="logsContainer" class="logs-container hidden">
        <div id="logsConsole" class="logs-console">
          <div class="log-line log-info">System initialized. Click any action to start.</div>
        </div>
      </div>
    </div>

    <!-- Footer Toast -->
    <div id="statusToast" class="status-toast hidden">
      <span id="toastMessage"></span>
    </div>
  </div>

  <script src="scripts/popup.js"></script>
</body>
</html>
