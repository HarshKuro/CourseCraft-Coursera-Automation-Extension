<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CourseCraft</title>
  <link rel="stylesheet" href="ui/popup.css" />
</head>
<body class="theme-dark">
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>CourseCraft</h1>
          <span class="badge-free">100% Free & Local</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <svg id="themeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5" />
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Open Settings" aria-label="Open Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Context Status Banner -->
    <div id="contextCard" class="context-card status-waiting">
      <div class="status-indicator"></div>
      <div class="context-details">
        <span id="courseStatusTitle" class="context-title">Detecting Coursera...</span>
        <span id="courseStatusSubtitle" class="context-subtitle">Open any Coursera course page to begin</span>
      </div>
    </div>

    <!-- Main Navigation / Grid of Features -->
    <main class="actions-section">
      <div class="section-label">Automate Tasks</div>
      <div class="action-grid" id="actionGrid">
        <!-- Lecture -->
        <button class="action-card" data-action="lecture">
          <div class="card-icon card-blue">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Watch Lecture</span>
            <span class="card-desc">Auto-complete active video</span>
          </div>
        </button>

        <!-- Skip Video+ -->
        <button class="action-card highlight-card" data-action="skipvideoplus">
          <div class="card-icon card-indigo">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 4 15 12 5 20 5 4" />
              <line x1="19" y1="5" x2="19" y2="19" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Skip Video+</span>
            <span class="card-desc">Bulk-complete all lectures</span>
          </div>
        </button>

        <!-- Reading -->
        <button class="action-card" data-action="reading">
          <div class="card-icon card-emerald">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Read Material</span>
            <span class="card-desc">Mark readings as done</span>
          </div>
        </button>

        <!-- Discussion -->
        <button class="action-card" data-action="discussion">
          <div class="card-icon card-amber">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Discussion</span>
            <span class="card-desc">Answer prompts</span>
          </div>
        </button>

        <!-- Dialogue -->
        <button class="action-card" data-action="dialogue">
          <div class="card-icon card-purple">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="10" rx="2" />
              <circle cx="12" cy="5" r="2" />
              <path d="M12 7v4" />
              <line x1="8" y1="16" x2="8.01" y2="16" />
              <line x1="16" y1="16" x2="16.01" y2="16" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">AI Coach Dialogue</span>
            <span class="card-desc">Complete interactive sessions</span>
          </div>
        </button>

        <!-- Ungraded Plugin -->
        <button class="action-card" data-action="ungradedplugin">
          <div class="card-icon card-teal">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" />
              <line x1="7" y1="7" x2="7.01" y2="7" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Practice Widgets</span>
            <span class="card-desc">Submit ungraded exercises</span>
          </div>
        </button>

        <!-- Quiz Assistant -->
        <button class="action-card card-span-2" data-action="quiz">
          <div class="card-icon card-cyan">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
              <polyline points="10 9 9 9 8 9" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Quiz Assistant</span>
            <span class="card-desc">Smart question solver with local history & free AI support</span>
          </div>
        </button>

        <!-- Course Backup -->
        <button class="action-card" data-action="coursebackup">
          <div class="card-icon card-rose">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Course Backup</span>
            <span class="card-desc">Export videos & slides</span>
          </div>
        </button>

        <!-- Shareable Link -->
        <button class="action-card" data-action="shareablelink">
          <div class="card-icon card-slate">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </svg>
          </div>
          <div class="card-content">
            <span class="card-title">Shareable Link</span>
            <span class="card-desc">Copy submission URL</span>
          </div>
        </button>
      </div>
    </main>

    <!-- Real-time Status Alert / Toast in Popup -->
    <div id="statusToast" class="popup-toast hidden">
      <span id="toastMessage">Ready</span>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-left">
        <span class="version-tag">v4.0.0</span>
        <span class="badge-dot"></span>
        <span class="footer-note">Press <kbd>Alt+W</kbd> to toggle</span>
      </div>
      <div class="footer-right">
        <span class="powered-by">CourseCraft</span>
      </div>
    </footer>
  </div>

  <script src="scripts/popup.js"></script>
</body>
</html>
